name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      # The tests stub Twitch, so the client id only has to exist for the build
      - name: Build
        run: yarn build:chrome
        env:
          VITE_TWITCH_CLIENT_ID: ci-test-client-id

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  package:
    name: Package for the Chrome Web Store
    needs: test
    # Not on pull requests: the build needs the real client id, which is a repository variable forks cannot read
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # The client id is public (it is in the sign-in URL), so it is a repository variable, not a secret
      - name: Build
        run: |
          test -n "${VITE_TWITCH_CLIENT_ID}" || { echo "Set the VITE_TWITCH_CLIENT_ID repository variable (Settings, Secrets and variables, Actions, Variables)"; exit 1; }
          yarn build:chrome
        env:
          VITE_TWITCH_CLIENT_ID: ${{ vars.VITE_TWITCH_CLIENT_ID }}

      - name: Zip the extension
        id: zip
        run: |
          version=$(node -p "require('./package.json').version")
          name="better-sidebar-${version}.zip"
          (cd dist_chrome && zip -r -q "../${name}" . -x ".vite/*")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}

      # A push to main releases when package.json holds a version that has no tag yet, so bumping the
      # version in a merged PR is what publishes. Pushing a v* tag by hand still releases that tag.
      - name: Check whether this version is already released
        id: released
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.zip.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach the zip to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.zip.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
