name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Typecheck and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      # The tests stub Twitch, so the client id only has to exist for the build
      - name: Build
        run: yarn build:chrome
        env:
          VITE_TWITCH_CLIENT_ID: ci-test-client-id

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

  package:
    name: Package for the Chrome Web Store
    needs: test
    # Not on pull requests: the build needs the real client id, which forks cannot read
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build
        run: yarn build:chrome
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}

      - name: Zip the extension
        id: zip
        run: |
          version=$(node -p "require('./package.json').version")
          name="better-sidebar-${version}.zip"
          (cd dist_chrome && zip -r -q "../${name}" . -x ".vite/*")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}

      - name: Attach the zip to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
